<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pico Park thumbnail">
  <rect width="200" height="125" fill="#1a1d24"/>

  <!-- Ground platform -->
  <rect x="8" y="90" width="184" height="12" rx="2" fill="#2a2f38" stroke="#3a4050" stroke-width="1"/>

  <!-- Middle floating platform -->
  <rect x="70" y="70" width="60" height="8" rx="2" fill="#3a4050" stroke="#3a4050" stroke-width="1"/>

  <!-- Left elevated platform (pressure plate area) -->
  <rect x="8" y="70" width="50" height="8" rx="2" fill="#3a4050" stroke="#3a4050" stroke-width="1"/>

  <!-- Pressure plate on left platform -->
  <rect x="22" y="66" width="20" height="5" rx="1" fill="#e8a14d" opacity="0.9"/>
  <text x="32" y="63" text-anchor="middle" fill="#e8a14d" font-family="system-ui" font-size="6" opacity="0.8">▼</text>

  <!-- Door on right side (open - showing gap) -->
  <rect x="168" y="58" width="14" height="32" rx="1" fill="#2a2f38" stroke="#3a4050" stroke-width="1.5"/>
  <!-- Door frame top -->
  <rect x="166" y="56" width="18" height="4" rx="1" fill="#3a4050"/>
  <!-- Door open state: glowing accent outline -->
  <rect x="168" y="58" width="14" height="32" rx="1" fill="none" stroke="#6cb1ff" stroke-width="1.5" opacity="0.8"/>
  <!-- Open door panel (swung open) -->
  <rect x="168" y="58" width="4" height="32" rx="1" fill="#6cb1ff" opacity="0.3"/>
  <!-- Door light beam -->
  <polygon points="182,60 200,50 200,90 182,90" fill="#6cb1ff" opacity="0.06"/>

  <!-- Character 1 (blue, standing on pressure plate) -->
  <!-- Body -->
  <rect x="28" y="57" width="10" height="10" rx="2" fill="#6cb1ff"/>
  <!-- Eyes -->
  <circle cx="31" cy="60" r="1.2" fill="#1a1d24"/>
  <circle cx="35" cy="60" r="1.2" fill="#1a1d24"/>
  <!-- Legs -->
  <rect x="29" y="67" width="3" height="4" rx="1" fill="#6cb1ff" opacity="0.8"/>
  <rect x="34" y="67" width="3" height="4" rx="1" fill="#6cb1ff" opacity="0.8"/>
  <!-- Press down arrow -->
  <text x="33" y="55" text-anchor="middle" fill="#6cb1ff" font-family="system-ui" font-size="7" opacity="0.7">↓</text>

  <!-- Character 2 (warm, through the door) -->
  <rect x="172" y="72" width="10" height="10" rx="2" fill="#e8a14d"/>
  <circle cx="175" cy="75" r="1.2" fill="#1a1d24"/>
  <circle cx="179" cy="75" r="1.2" fill="#1a1d24"/>
  <rect x="173" y="82" width="3" height="4" rx="1" fill="#e8a14d" opacity="0.8"/>
  <rect x="178" y="82" width="3" height="4" rx="1" fill="#e8a14d" opacity="0.8"/>
  <!-- Run arrow -->
  <text x="177" y="70" text-anchor="middle" fill="#e8a14d" font-family="system-ui" font-size="7" opacity="0.7">→</text>

  <!-- Connection line / rope between characters (teamwork visual) -->
  <path d="M38,62 Q103,40 172,77" fill="none" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Stars / score dots top -->
  <circle cx="90"  cy="15" r="4" fill="#e8a14d" opacity="0.4"/>
  <circle cx="100" cy="15" r="4" fill="#e8a14d" opacity="0.8"/>
  <circle cx="110" cy="15" r="4" fill="#e8a14d" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="7">PICO PARK</text>
</svg>
