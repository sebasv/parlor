<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ludo thumbnail">
  <!-- Background -->
  <rect width="200" height="125" fill="#1a1d24"/>

  <!-- 4-pointed star board (mid-game scene) -->
  <!-- Centre at (67, 63), R_outer=52, R_inner=26 -->
  <!-- Tips: up(67,11), right(119,63), down(67,115), left(15,63) -->
  <!-- Valleys: NE(101,29), SE(101,97), SW(33,97), NW(33,29) -->

  <!-- Star polygon background -->
  <polygon points="67,11 101,29 119,63 101,97 67,115 33,97 15,63 33,29"
           fill="#e8e0d0" stroke="#555" stroke-width="1.5"/>

  <!-- Tinted star points per player -->
  <!-- Red (up): tip(67,11), NW(33,29), NE(101,29) -->
  <polygon points="67,11 33,29 101,29" fill="#ef4444" opacity="0.2"/>
  <!-- Yellow (right): tip(119,63), NE(101,29), SE(101,97) -->
  <polygon points="119,63 101,29 101,97" fill="#facc15" opacity="0.2"/>
  <!-- Green (down): tip(67,115), SE(101,97), SW(33,97) -->
  <polygon points="67,115 101,97 33,97" fill="#22c55e" opacity="0.2"/>
  <!-- Blue (left): tip(15,63), SW(33,97), NW(33,29) -->
  <polygon points="15,63 33,97 33,29" fill="#3b82f6" opacity="0.2"/>

  <!-- Home column strips (coloured lines from tip toward centre) -->
  <line x1="67" y1="11" x2="67" y2="56" stroke="#ef4444" stroke-width="10" opacity="0.3" stroke-linecap="round"/>
  <line x1="119" y1="63" x2="74" y2="63" stroke="#facc15" stroke-width="10" opacity="0.3" stroke-linecap="round"/>
  <line x1="67" y1="115" x2="67" y2="70" stroke="#22c55e" stroke-width="10" opacity="0.3" stroke-linecap="round"/>
  <line x1="15" y1="63" x2="60" y2="63" stroke="#3b82f6" stroke-width="10" opacity="0.3" stroke-linecap="round"/>

  <!-- Centre finish area -->
  <circle cx="67" cy="63" r="8" fill="#888" opacity="0.55"/>

  <!-- Yard circles near each tip -->
  <circle cx="67" cy="21" r="10" fill="#ef4444" opacity="0.25" stroke="#ef4444" stroke-width="1"/>
  <circle cx="109" cy="63" r="10" fill="#facc15" opacity="0.25" stroke="#facc15" stroke-width="1"/>
  <circle cx="67" cy="105" r="10" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-width="1"/>
  <circle cx="25" cy="63" r="10" fill="#3b82f6" opacity="0.25" stroke="#3b82f6" stroke-width="1"/>

  <!-- Sample track squares (a few along the perimeter) -->
  <rect x="52" y="17" width="8" height="8" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="1"/>
  <rect x="63" y="17" width="8" height="8" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="1"/>
  <rect x="75" y="17" width="8" height="8" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="1"/>
  <rect x="98" y="38" width="8" height="8" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="1"/>
  <rect x="108" y="50" width="8" height="8" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="1"/>

  <!-- Sample pawns mid-game -->
  <!-- Red pawn on track (approaching tip) -->
  <circle cx="56" cy="21" r="4" fill="#ef4444" stroke="#333" stroke-width="0.8"/>
  <!-- Yellow pawn on home column -->
  <circle cx="99" cy="63" r="4" fill="#facc15" stroke="#333" stroke-width="0.8"/>
  <!-- Green pawn on track -->
  <circle cx="82" cy="102" r="4" fill="#22c55e" stroke="#333" stroke-width="0.8"/>
  <!-- Blue pawn in yard -->
  <circle cx="25" cy="59" r="3.5" fill="#3b82f6" stroke="#333" stroke-width="0.8"/>

  <!-- Sidebar area -->
  <rect x="135" y="8" width="58" height="110" fill="#252830" rx="4"/>
  <text x="164" y="28" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="9">Players</text>

  <!-- Player indicators -->
  <circle cx="143" cy="42" r="4" fill="#ef4444"/>
  <text x="150" y="46" fill="#e6e6e6" font-family="system-ui" font-size="8">Red</text>

  <circle cx="143" cy="56" r="4" fill="#facc15"/>
  <text x="150" y="60" fill="#e6e6e6" font-family="system-ui" font-size="8">Yellow</text>

  <circle cx="143" cy="70" r="4" fill="#22c55e"/>
  <text x="150" y="74" fill="#e6e6e6" font-family="system-ui" font-size="8">Green</text>

  <circle cx="143" cy="84" r="4" fill="#3b82f6"/>
  <text x="150" y="88" fill="#e6e6e6" font-family="system-ui" font-size="8">Blue</text>

  <!-- Dice / Roll button -->
  <rect x="143" y="95" width="22" height="16" fill="#1a1d24" rx="3" stroke="#6cb1ff" stroke-width="1"/>
  <text x="154" y="107" text-anchor="middle" fill="#e6e6e6" font-family="system-ui" font-size="10">Roll</text>
</svg>
