<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ludo thumbnail">
  <!-- Background -->
  <rect width="200" height="125" fill="#1a1d24"/>

  <!-- Board base -->
  <rect x="12" y="8" width="110" height="110" fill="#e8e0d0" rx="3"/>

  <!-- Yard areas (corner squares) -->
  <rect x="12" y="8"   width="44" height="44" fill="#ef4444" opacity="0.4"/>
  <rect x="78" y="8"   width="44" height="44" fill="#22c55e" opacity="0.4"/>
  <rect x="12" y="74"  width="44" height="44" fill="#facc15" opacity="0.4"/>
  <rect x="78" y="74"  width="44" height="44" fill="#3b82f6" opacity="0.4"/>

  <!-- Cross track -->
  <rect x="56" y="8"   width="22" height="110" fill="#e0d8c8"/>
  <rect x="12" y="52"  width="110" height="22" fill="#e0d8c8"/>

  <!-- Home columns -->
  <rect x="64" y="60" width="7" height="44" fill="#ef4444" opacity="0.4"/>
  <rect x="64" y="20" width="7" height="32" fill="#22c55e" opacity="0.4"/>
  <rect x="20" y="59" width="36" height="7" fill="#facc15" opacity="0.4"/>
  <rect x="68" y="59" width="36" height="7" fill="#3b82f6" opacity="0.4"/>

  <!-- Centre diamond -->
  <polygon points="63,56 71,56 75,63 71,70 63,70 59,63" fill="#888" opacity="0.5"/>

  <!-- Grid lines (light) -->
  <g stroke="#bbb" stroke-width="0.5" fill="none">
    <line x1="56" y1="8" x2="56" y2="118"/>
    <line x1="78" y1="8" x2="78" y2="118"/>
    <line x1="12" y1="52" x2="122" y2="52"/>
    <line x1="12" y1="74" x2="122" y2="74"/>
  </g>

  <!-- Sample pawns -->
  <!-- Red pawns on track -->
  <circle cx="67" cy="100" r="5" fill="#ef4444" stroke="#333" stroke-width="1"/>
  <circle cx="30" cy="63" r="5" fill="#facc15" stroke="#333" stroke-width="1"/>
  <!-- Green pawn in home column -->
  <circle cx="67" cy="38" r="5" fill="#22c55e" stroke="#333" stroke-width="1"/>
  <!-- Blue pawn on track -->
  <circle cx="100" cy="63" r="5" fill="#3b82f6" stroke="#333" stroke-width="1"/>

  <!-- Sidebar area -->
  <rect x="135" y="8" width="58" height="110" fill="#252830" rx="4"/>
  <text x="164" y="28" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="9">Players</text>

  <!-- Player indicators -->
  <circle cx="143" cy="42" r="4" fill="#ef4444"/>
  <text x="150" y="46" fill="#e6e6e6" font-family="system-ui" font-size="8">Red</text>

  <circle cx="143" cy="56" r="4" fill="#facc15"/>
  <text x="150" y="60" fill="#e6e6e6" font-family="system-ui" font-size="8">Yellow</text>

  <circle cx="143" cy="70" r="4" fill="#22c55e"/>
  <text x="150" y="74" fill="#e6e6e6" font-family="system-ui" font-size="8">Green</text>

  <circle cx="143" cy="84" r="4" fill="#3b82f6"/>
  <text x="150" y="88" fill="#e6e6e6" font-family="system-ui" font-size="8">Blue</text>

  <!-- Dice -->
  <rect x="143" y="95" width="22" height="16" fill="#1a1d24" rx="3" stroke="#6cb1ff" stroke-width="1"/>
  <text x="154" y="107" text-anchor="middle" fill="#e6e6e6" font-family="system-ui" font-size="10">Roll</text>
</svg>
