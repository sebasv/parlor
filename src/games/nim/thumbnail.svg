<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nim thumbnail">
  <rect width="200" height="125" fill="#1a1d24"/>
  <!-- Labels -->
  <g font-family="system-ui" font-size="9" fill="#9aa0a6" text-anchor="middle">
    <text x="40" y="118">3</text>
    <text x="100" y="118">5</text>
    <text x="160" y="118">7</text>
  </g>
  <!-- Pile 1: 3 sticks (originally 3, none removed) -->
  <g stroke="#6cb1ff" stroke-width="5" stroke-linecap="round">
    <line x1="28" y1="105" x2="28" y2="75"/>
    <line x1="40" y1="105" x2="40" y2="75"/>
    <line x1="52" y1="105" x2="52" y2="75"/>
  </g>
  <!-- Pile 2: 5 sticks (originally 7, 2 removed — shown as ghosts) -->
  <g stroke="#6cb1ff" stroke-width="5" stroke-linecap="round">
    <line x1="79" y1="105" x2="79" y2="63"/>
    <line x1="91" y1="105" x2="91" y2="63"/>
    <line x1="103" y1="105" x2="103" y2="63"/>
    <line x1="115" y1="105" x2="115" y2="63"/>
    <line x1="127" y1="105" x2="127" y2="63"/>
  </g>
  <!-- Ghost sticks (removed from pile 2) -->
  <g stroke="#2a2f38" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 3">
    <line x1="79" y1="63" x2="79" y2="33"/>
    <line x1="91" y1="63" x2="91" y2="33"/>
  </g>
  <!-- Pile 3: 7 sticks (originally 7) -->
  <g stroke="#e8a14d" stroke-width="5" stroke-linecap="round">
    <line x1="136" y1="105" x2="136" y2="48"/>
    <line x1="148" y1="105" x2="148" y2="48"/>
    <line x1="160" y1="105" x2="160" y2="48"/>
    <line x1="172" y1="105" x2="172" y2="48"/>
    <line x1="148" y1="48" x2="148" y2="18"/>
    <line x1="160" y1="48" x2="160" y2="18"/>
    <line x1="172" y1="48" x2="172" y2="18"/>
  </g>
