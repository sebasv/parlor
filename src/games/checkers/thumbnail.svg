<circle cx="63.5" cy="12.5" r="5"/><circle cx="115.5" cy="12.5" r="5"/>
<circle cx="76.5" cy="25.5" r="5"/><circle cx="89.5" cy="38.5" r="5"/>
<!-- blue king row6c1 with dot --><circle cx="63.5" cy="90.5" r="5"/>
</g>
<circle cx="63.5" cy="90.5" r="2" fill="#1a1d24"/>
<!-- Warm pieces: row5c0(50,77.5), row5c4(102.5,77.5), row6c5(115.5,90.5), row7c2(76.5,103.5) -->
