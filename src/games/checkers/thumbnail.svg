<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Checkers thumbnail"><rect width="200" height="125" fill="#1a1d24"/>
<!-- 8x8 board, cell=13px, x0=44, y0=6 -->
