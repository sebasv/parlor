<!-- row2 cols 1,3,5,7 --><rect x="57" y="32" width="13" height="13"/><rect x="83" y="32" width="13" height="13"/><rect x="109" y="32" width="13" height="13"/><rect x="135" y="32" width="13" height="13"/>
<!-- row3 cols 0,2,4,6 --><rect x="44" y="45" width="13" height="13"/><rect x="70" y="45" width="13" height="13"/><rect x="96" y="45" width="13" height="13"/><rect x="122" y="45" width="13" height="13"/>
<!-- row4 cols 1,3,5,7 --><rect x="57" y="58" width="13" height="13"/><rect x="83" y="58" width="13" height="13"/><rect x="109" y="58" width="13" height="13"/><rect x="135" y="58" width="13" height="13"/>
