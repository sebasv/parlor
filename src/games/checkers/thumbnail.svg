<!-- row6 cols 1,3,5,7 --><rect x="57" y="84" width="13" height="13"/><rect x="83" y="84" width="13" height="13"/><rect x="109" y="84" width="13" height="13"/><rect x="135" y="84" width="13" height="13"/>
<!-- row7 cols 0,2,4,6 --><rect x="44" y="97" width="13" height="13"/><rect x="70" y="97" width="13" height="13"/><rect x="96" y="97" width="13" height="13"/><rect x="122" y="97" width="13" height="13"/>
</g>
<rect x="44" y="6" width="104" height="104" fill="none" stroke="#3a4050" stroke-width="1"/>
<!-- Blue pieces: row0c1(63.5,12.5), row0c5(115.5,12.5), row1c2(76.5,25.5), row2c3(89.5,38.5) -->
