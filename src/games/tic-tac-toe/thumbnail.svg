<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tic-Tac-Toe thumbnail">
  <rect width="200" height="125" fill="#1a1d24"/>
  <!-- Grid lines -->
  <g stroke="#3a4050" stroke-width="2" stroke-linecap="round">
    <line x1="73" y1="18" x2="73" y2="107"/>
    <line x1="127" y1="18" x2="127" y2="107"/>
    <line x1="19" y1="48" x2="181" y2="48"/>
    <line x1="19" y1="78" x2="181" y2="78"/>
  </g>
  <!-- X at top-left (accent) -->
  <g stroke="#6cb1ff" stroke-width="3.5" stroke-linecap="round">
    <line x1="30" y1="25" x2="60" y2="45"/>
    <line x1="60" y1="25" x2="30" y2="45"/>
  </g>
  <!-- X at center (accent) -->
  <g stroke="#6cb1ff" stroke-width="3.5" stroke-linecap="round">
    <line x1="84" y1="55" x2="114" y2="75"/>
    <line x1="114" y1="55" x2="84" y2="75"/>
  </g>
  <!-- X at bottom-right (accent, completing diagonal threat) -->
  <g stroke="#6cb1ff" stroke-width="3.5" stroke-linecap="round">
    <line x1="138" y1="85" x2="168" y2="105"/>
    <line x1="168" y1="85" x2="138" y2="105"/>
  </g>
  <!-- O at top-right (player 2) -->
  <circle cx="154" cy="33" r="13" fill="none" stroke="#e8a14d" stroke-width="3.5"/>
  <!-- O at bottom-left (player 2) -->
  <circle cx="46" cy="92" r="13" fill="none" stroke="#e8a14d" stroke-width="3.5"/>
</svg>
