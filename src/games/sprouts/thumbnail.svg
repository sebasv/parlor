<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sprouts thumbnail">
  <rect width="200" height="125" fill="#1a1d24"/>
  <!-- Sprouts: dots with curves connecting them -->
  <!-- Dot A at (50, 35) - 2 connections -->
  <!-- Dot B at (150, 40) - 1 connection -->
  <!-- Dot C at (80, 90) - 2 connections -->
  <!-- Dot D at (140, 85) - 1 connection (new, created on AB connection) -->

  <!-- Curve from A to B (through top), passes through D which was added as midpoint -->
  <path d="M 50 35 C 70 10, 120 10, 150 40" stroke="#6cb1ff" stroke-width="2" fill="none"/>
  <!-- New dot D created on AB path at midpoint -->
  <circle cx="100" cy="18" r="5" fill="#2a2f38" stroke="#6cb1ff" stroke-width="1.5"/>

  <!-- Curve from A to C (sweeping left) -->
  <path d="M 50 35 C 20 55, 30 80, 80 90" stroke="#e8a14d" stroke-width="2" fill="none"/>

  <!-- Curve from C to D (new dot on path) looping around -->
  <path d="M 80 90 C 90 110, 130 110, 140 85" stroke="#6cb1ff" stroke-width="2" fill="none"/>

  <!-- Dot A: 2 lines = partially consumed, slightly dim -->
  <circle cx="50" cy="35" r="6" fill="#2a2f38" stroke="#e8a14d" stroke-width="2"/>
  <text x="50" y="32" text-anchor="middle" fill="#e8a14d" font-family="system-ui" font-size="6" font-weight="bold">2</text>

  <!-- Dot B: 1 line = still active -->
  <circle cx="150" cy="40" r="6" fill="#2a2f38" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="150" y="37" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="6">1</text>

  <!-- Dot C: 2 lines = partially consumed -->
  <circle cx="80" cy="90" r="6" fill="#2a2f38" stroke="#e8a14d" stroke-width="2"/>
  <text x="80" y="87" text-anchor="middle" fill="#e8a14d" font-family="system-ui" font-size="6" font-weight="bold">2</text>

  <!-- Dot D on path from C: 1 line -->
  <circle cx="140" cy="85" r="6" fill="#2a2f38" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="6">1</text>

  <!-- Label: connections count -->
  <text x="100" y="118" text-anchor="middle" fill="#9aa0a6" font-family="system-ui" font-size="7">connection counts shown</text>
</svg>
