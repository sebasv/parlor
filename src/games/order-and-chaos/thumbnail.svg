<svg viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Order and Chaos thumbnail"><rect width="200" height="125" fill="#1a1d24"/>
<!-- 6x6 grid, cell=18px, x0=47, y0=8 -->
<g stroke="#2a2f38" stroke-width="1" fill="none">
<line x1="47" y1="8" x2="47" y2="116"/><line x1="65" y1="8" x2="65" y2="116"/><line x1="83" y1="8" x2="83" y2="116"/><line x1="101" y1="8" x2="101" y2="116"/><line x1="119" y1="8" x2="119" y2="116"/><line x1="137" y1="8" x2="137" y2="116"/><line x1="155" y1="8" x2="155" y2="116"/>
