<line x1="68" y1="29" x2="80" y2="41"/><line x1="80" y1="29" x2="68" y2="41"/>
<line x1="86" y1="47" x2="98" y2="59"/><line x1="98" y1="47" x2="86" y2="59"/>
<line x1="104" y1="65" x2="116" y2="77"/><line x1="116" y1="65" x2="104" y2="77"/>
<!-- extra blue X -->
<line x1="68" y1="83" x2="80" y2="95"/><line x1="80" y1="83" x2="68" y2="95"/>
<line x1="140" y1="11" x2="152" y2="23"/><line x1="152" y1="11" x2="140" y2="23"/>
</g>
<!-- Warm O circles -->
<g stroke="#e8a14d" stroke-width="2.2" fill="none">
<circle cx="56" cy="53" r="6"/>
