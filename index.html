<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Parlor Games</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static form for Netlify Forms build-time detection. The runtime UI in
      MetaMenu.tsx posts URL-encoded data to '/' with form-name=feedback.
    -->
    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="locale" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
